services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${dbUsername}
      POSTGRES_PASSWORD: ${dbPassword}
      POSTGRES_DB: ${dbName}

    ports:
      - "${dbPort}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
