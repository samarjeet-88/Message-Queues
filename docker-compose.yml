services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${dbUsername}
      POSTGRES_PASSWORD: ${dbPassword}
      POSTGRES_DB: ${dbName}

    ports:
      - "${dbPort}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
